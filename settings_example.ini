[Settings]
; Selected mouse device name (automatically saved by the application)
SelectedDeviceName=

; Window position (automatically saved by the application)
WindowPosX=
WindowPosY=

; Font settings (automatically saved by the application)
FontName=
FontSize=

; Idle threshold in seconds - how long the system must be idle before pausing the tracker
; Default: 10 seconds
; You can change this value to customize when the tracker pauses due to inactivity
IdleThresholdSeconds=10

; Session logging to SQLite database (disabled by default)
; Set to true to enable logging mouseless sessions to database.db
; Sessions shorter than 10 seconds are not logged
; Default: false
LoggingEnabled=false
